[package]
name = "ta-engine"
version = "0.9.0"
description = "Total Annihilation engine (uses your own game files)"
edition = "2021"

[lib]
name = "ta_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
